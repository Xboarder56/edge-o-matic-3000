name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e eom3k

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=.pio/build/eom3k
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes --repo "$GITHUB_REPOSITORY" \
            "$B/firmware.bin" "$B/bootloader.bin" "$B/partitions.bin" \
            "$B/plugin-api.json" "$B/plugin-api.sha256"

  update-feed:
    # Publish the device update feed (remote_update_url) on GitHub Pages:
    #   <pages>/version.txt  latest version, e.g. 2.1.0-rc.3
    #   <pages>/             JSON {"version","date","assets":[{"role":"image","url":...}]}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Build feed
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/firmware.bin"
          mkdir -p feed && cd feed
          printf '%s' "$version" > version.txt
          printf '{"version":"%s","date":"%s","assets":[{"role":"image","name":"firmware.bin","url":"%s"}]}' \
            "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$url" > index.html
          touch .nojekyll
          cat version.txt; echo; cat index.html; echo

      - name: Publish to gh-pages
        working-directory: feed
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update feed: ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
